# deploy.yml
#
# Este archivo hace que, cada vez que subas un cambio (git push) a la rama
# "main", GitHub compile automáticamente el sitio con Astro y lo publique
# en GitHub Pages. No necesitas correr "npm run build" tú mismo ni subir
# la carpeta dist/ — solo subes el código fuente (src/, public/, etc.) y
# esto se encarga del resto.

name: Publicar blog en GitHub Pages

on:
  # Se ejecuta cada vez que hay un push a la rama principal
  push:
    branches: [main]
  # También permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:

# Permisos necesarios para que la acción pueda publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos publicaciones corran al mismo tiempo
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Compilar el sitio con Astro
        run: npm run build

      - name: Preparar los archivos para GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio compilado (carpeta dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
